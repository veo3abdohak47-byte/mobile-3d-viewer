<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile 3D Viewer - Basic & Advanced</title>
    <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
    <div id="app">
        <div class="mode-selector">
            <button id="basicViewerBtn" class="mode-btn active">Basic Viewer</button>
            <button id="advancedViewerBtn" class="mode-btn">Advanced Viewer</button>
        </div>
        
        <!-- Basic Viewer -->
        <div id="basicViewer" class="viewer-container active">
            <div id="basicCanvas" class="canvas-container"></div>
            <div class="controls-panel">
                <div class="file-upload">
                    <input type="file" id="basicFileInput" accept=".glb,.gltf,.obj,.fbx" />
                    <button id="basicUploadBtn" class="upload-btn">📁 Load Model</button>
                </div>
                <div class="basic-controls">
                    <button id="basicAutoRotateBtn" class="control-btn">🔄 Auto Rotate</button>
                    <button id="basicResetBtn" class="control-btn">↺ Reset View</button>
                    <button id="basicFullscreenBtn" class="control-btn">⛶ Fullscreen</button>
                </div>
                <div class="info-panel">
                    <p id="basicModelInfo">Load a model to start viewing</p>
                </div>
            </div>
        </div>
        
        <!-- Advanced Viewer -->
        <div id="advancedViewer" class="viewer-container">
            <div id="advancedCanvas" class="canvas-container"></div>
            <div class="controls-panel">
                <div class="file-upload">
                    <input type="file" id="advancedFileInput" accept=".glb,.gltf,.obj,.fbx" />
                    <button id="advancedUploadBtn" class="upload-btn">📁 Load Model</button>
                </div>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="animation">Animation</button>
                    <button class="tab-btn" data-tab="lighting">Lighting</button>
                    <button class="tab-btn" data-tab="material">Material</button>
                    <button class="tab-btn" data-tab="examples">Examples</button>
                </div>
                
                <!-- Animation Tab -->
                <div class="tab-content active" id="animationTab">
                    <div class="animation-controls">
                        <select id="animationSelect" class="control-input">
                            <option>No animations loaded</option>
                        </select>
                        <button id="playAnimBtn" class="control-btn">▶ Play</button>
                        <button id="pauseAnimBtn" class="control-btn">⏸ Pause</button>
                        <button id="stopAnimBtn" class="control-btn">⏹ Stop</button>
                    </div>
                    <div class="slider-group">
                        <label>Speed:</label>
                        <input type="range" id="animSpeed" min="0.1" max="3" step="0.1" value="1" class="control-slider">
                        <span id="speedValue">1.0x</span>
                    </div>
                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" id="skeletonToggle" /> Show Skeleton
                        </label>
                    </div>
                </div>
                
                <!-- Lighting Tab -->
                <div class="tab-content" id="lightingTab">
                    <div class="slider-group">
                        <label>Light Intensity:</label>
                        <input type="range" id="lightIntensity" min="0" max="10" step="0.1" value="5" class="control-slider">
                        <span id="intensityValue">5.0</span>
                    </div>
                    <div class="slider-group">
                        <label>Environment Intensity:</label>
                        <input type="range" id="envIntensity" min="0" max="3" step="0.1" value="1.5" class="control-slider">
                        <span id="envIntensityValue">1.5</span>
                    </div>
                    <div class="slider-group">
                        <label>Tone Mapping Exposure:</label>
                        <input type="range" id="toneMappingExposure" min="0" max="2" step="0.1" value="0.5" class="control-slider">
                        <span id="exposureValue">0.5</span>
                    </div>
                </div>
                
                <!-- Material Tab -->
                <div class="tab-content" id="materialTab">
                    <div class="slider-group">
                        <label>Metalness:</label>
                        <input type="range" id="metalness" min="0" max="1" step="0.1" value="1" class="control-slider">
                        <span id="metalnessValue">1.0</span>
                    </div>
                    <div class="slider-group">
                        <label>Roughness:</label>
                        <input type="range" id="roughness" min="0" max="1" step="0.1" value="0.2" class="control-slider">
                        <span id="roughnessValue">0.2</span>
                    </div>
                    <div class="color-group">
                        <label>Model Color:</label>
                        <input type="color" id="modelColor" value="#ffffff" class="control-input">
                    </div>
                </div>
                
                <!-- Examples Tab -->
                <div class="tab-content" id="examplesTab">
                    <div class="examples-grid">
                        <button class="example-btn" data-model="soldier">Soldier Walk</button>
                        <button class="example-btn" data-model="duck">Duck</button>
                        <button class="example-btn" data-model="gltf-box">Gltf Box</button>
                        <button class="example-btn" data-model="parrot">Parrot</button>
                    </div>
                    <p class="example-note">Load example models from Three.js repository</p>
                </div>
                
                <div class="info-panel">
                    <p id="advancedModelInfo">Load a model or select an example</p>
                </div>
            </div>
        </div>
    </div>
    
    <script type="module" src="/src/main.js"></script>
</body>
</html>
